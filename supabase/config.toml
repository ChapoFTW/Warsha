project_id = "warsha"
[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
[db]
major_version = 15
[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed-discovery-fixture.sql"]
[auth]
enabled = true
site_url = "http://localhost:8081"
# The app scheme and the Expo dev client are how a phone comes back from a
# confirmation or recovery email. The last three are the browser's equivalent:
# the web asks for a link to its own origin rather than borrowing `warsha://`,
# so recovery works in a browser without native configuration changing.
#
# This file configures a LOCAL stack. The deployed origins must be listed
# separately in the hosted project's own redirect allowlist, or Auth will refuse
# the redirect and the link will look broken.
additional_redirect_urls = [
  "warsha://**",
  "exp://**",
  "http://localhost:8081/**",
  "http://app.localhost:3000/**",
  "http://localhost:3000/**",
  "https://app.usewarsha.com/**",
]
# Anti-abuse limits for the identity provider itself.
#
# Warsha's own limiter in `private.rate_limit_policies` cannot reach these
# surfaces: sign-in, sign-up, token refresh and verification are handled by
# GoTrue before any SQL runs. Three policies in that table are marked
# `enforced_by = 'supabase_auth'` for exactly that reason, and nothing in the
# repository said what those limits were -- they were whatever the platform
# defaulted to, unreviewed and unrecorded.
#
# ## Every value here was checked against the running container
#
# The CLI does NOT reject an unknown key in this section. A deliberate
# `not_a_real_key = 99` was accepted in full, so a misspelling would leave a
# block that reads like hardening and does nothing. Each key below was therefore
# confirmed by reading what GoTrue actually received:
#
#     docker inspect supabase_auth_warsha --format '{{range .Config.Env}}{{println .}}{{end}}' | grep RATE_LIMIT
#
# `scripts/auth-rate-limit-probe.mjs` drives real failed sign-ins against the
# local stack and reports where the limit bites. It needs a running container, so
# it is not in the deterministic suite.
[auth.rate_limit]
# -> GOTRUE_RATE_LIMIT_SMS_SENT=10. Per hour. Warsha does not use phone OTP for
# customers; this bounds the surface anyway.
sms_sent = 10
# -> GOTRUE_RATE_LIMIT_ANONYMOUS_USERS=10. Per hour per IP. Warsha creates no
# anonymous users, so this is a floor rather than a working limit.
anonymous_users = 10
# -> GOTRUE_RATE_LIMIT_TOKEN_REFRESH=150. Per five minutes per IP.
token_refresh = 150
# -> GOTRUE_RATE_LIMIT_VERIFY=30. Per five minutes per IP. OTP and recovery-link
# verification, which is the surface a stolen link would be replayed against.
token_verifications = 30
# -> GOTRUE_RATE_LIMIT_EMAIL_SENT, but NOT with this value locally: the CLI
# forces 360000 on the local stack so developer mail testing is never throttled.
# Declared here for the hosted projects, where it does apply, and deliberately
# not claimed as verified.
email_sent = 10

# ## The one that cannot be declared here — and what actually protects it
#
# There is no key in this section for failed sign-in attempts.
# `sign_in_sign_ups = 30` was tried and produced NO GoTrue setting at all on CLI
# 2.116.0 — silently dropped, like any unrecognised key — so Warsha cannot
# declare that limit through this file.
#
# It does not follow that the surface is unprotected, and an earlier note here
# came close to implying that. The two environments were measured separately:
#
#   local      40 consecutive failed password sign-ins returned forty 400s and
#              not one 429. The local stack does not enforce this limit.
#
#   hosted     the same probe against warsha-development returned 400 until
#              attempt 33 and then 429 — consistent with the platform default of
#              roughly 30 per five minutes per IP. The protection is real, it is
#              simply the platform's rather than ours, and it is invisible from a
#              local container.
#
# So the honest statement is: this limit is active on the hosted projects at the
# platform default, is not expressible in this file at this CLI version, and is
# therefore not tuned by Warsha. `scripts/dev-auth-bruteforce-probe.mjs` is what
# measured it and what would notice if it changed.
#
# `private.rate_limit_policies` separately declares `auth_sign_in` at 10 per 300
# seconds per ACCOUNT. That is a different and complementary limit — per account
# rather than per IP — and it is marked `enforced_by = 'supabase_auth'` because
# nothing in this repository can apply it to GoTrue's own endpoint.
#
# Warsha's WORKER sign-in is a different story and is genuinely ours: it goes
# through the `worker-auth` Edge Function, which calls
# `private.enforce_rate_limit('worker_auth_sign_in')` before touching GoTrue.
# Measured on Development: eleven wrong passwords against one account returns
# 429 `rate_limited`, five wrong passwords still leave the correct password
# working, and an unknown phone is answered exactly like a known one with a
# wrong password.

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
[auth.sms]
enable_signup = true
enable_confirmations = true
max_frequency = "2s"
[auth.sms.test_otp]
"+201000000008" = "123456"
"+201099221106" = "123456"
[auth.sms.textlocal]
enabled = true
api_key = "local-test-only-no-real-sms"
sender = "WarshaLocal"
[functions.worker-auth]
verify_jwt = false
# The automation caller is a machine with no Supabase user, so it has no user
# JWT to verify. The function authenticates the bearer token itself, in constant
# time, against a secret that exists only in its own Edge secrets.
[functions.warsha-automation]
verify_jwt = false
[storage]
enabled = true

# ---------------------------------------------------------------------------
# warsha-production
# ---------------------------------------------------------------------------
# Everything above configures the LOCAL Docker stack. Its site_url is
# http://localhost:8081 and its redirect list is full of localhost origins, so
# pushing the top-level [auth] block at a hosted project would point Production
# authentication at a developer's laptop. That is why this block exists: the
# CLI applies a [remotes.*] section only to the project whose ref matches, and
#  reads THIS.
#
# ## Before running config push, read this
#
#  owns the WHOLE auth configuration for the target, not the
# fields that happen to have changed. Anything this block does not declare is
# sent as the schema default -- and for [auth.email.smtp] the default is
# , which would switch off Production's working Resend mailer
# and take confirmation, recovery and invitation email down with it.
#
# So the SMTP section below is declared in full and deliberately, and the one
# value that must not live in a repository is read from the environment:
#
#     export RESEND_SMTP_PASSWORD=...        # the Resend API key
#     npx supabase config push --project-ref ekgwzljpcxpxnklzxuvj
#
# Without that variable exported the push will send an empty password. Set it,
# or do not push.
#
# The confirmation template and subject were applied on 2026-09-01 through the
# Management API instead, precisely because that is surgical -- two fields, no
# possibility of disturbing SMTP. This block records the intended state so the
# next change can be a reviewed diff rather than a dashboard edit.
[remotes.production]
project_id = "ekgwzljpcxpxnklzxuvj"

[remotes.production.auth]
enabled = true
# Verified live on the project, not copied from Development, whose allow list is
# a narrower set of specific callback paths.
site_url = "https://app.usewarsha.com"
additional_redirect_urls = [
  "https://usewarsha.com/**",
  "https://app.usewarsha.com/**",
  "https://admin.usewarsha.com/**",
  "warsha://**",
  "exp://**",
]

[remotes.production.auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[remotes.production.auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_SMTP_PASSWORD)"
admin_email = "noreply@mail.usewarsha.com"
sender_name = "Warsha"

# The one custom template Warsha has. Development's live configuration is the
# authority for its content -- see supabase/templates/confirm-signup.html --
# and every other auth email is still the Supabase default in BOTH projects,
# so there is nothing else here to declare.
[remotes.production.auth.email.template.confirmation]
subject = "أكد بريدك الإلكتروني في ورشة | Confirm your Warsha email"
content_path = "./templates/confirm-signup.html"
