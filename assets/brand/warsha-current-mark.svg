<!--
  Warsha primary mark — "The Current" (approved concept, Round 2).
  A rounded protective frame with a concealed W-shaped flow line that
  enters and exits the frame with uneven peaks.

  Geometry is reconstructed from the approved brand PDF
  (docs/brand/Warsha marketplace logo design.pdf). The flow-line vertices
  below reproduce the source proportions to within 0.001 of the frame side:
    x / side = 0, 0.2286, 0.4286, 0.6286, 1
    y / side = 0.6000, 0.2429, 0.5429, 0.3143, 0.7429
    corner radius / side = 0.2571

  currentColor is used so a single file serves light and dark surfaces.
  Do not add gradients, shadows, or fills.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none" role="img" aria-label="Warsha">
  <rect x="2" y="2" width="28" height="28" rx="7.2" ry="7.2"
        stroke="currentColor" stroke-width="2.5" />
  <path d="M2 18.8 L8.4 8.8 L14 17.2 L19.6 10.8 L30 22.8"
        stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
