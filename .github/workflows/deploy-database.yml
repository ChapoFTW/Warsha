name: Deploy database

# Schema deployment is deliberately manual, environment-approved, and separate
# from every other release step. It never runs on a push, never runs from an
# unreviewed branch, and never touches production without a recorded approval.
#
# It does NOT build a mobile app, deploy a web bundle, activate a provider, or
# activate configuration. Those are separate, sequenced steps in
# docs/operations/deployment-runbook.md.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      confirm:
        description: Type the environment name again to confirm
        required: true
        type: string
      dry_run:
        description: Compare and dry-run only; apply nothing
        required: true
        type: boolean
        default: true
      # Deliberately a filename and not a checkbox. "Skip the backup" as a
      # boolean gets ticked once for a good reason and then out of habit; a
      # field that demands the exact migration being excepted has to be filled
      # in again, correctly, every single time.
      backup_exception:
        description: >-
          Leave empty when PRE_MIGRATION_BACKUP_REF names a verified restore
          point. Otherwise the exact migration filename that the owner has
          approved in docs/operations/migration-backup-exceptions.json.
        required: false
        type: string
        default: ''

concurrency:
  group: deploy-database-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation must match the target
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "Confirmation did not match the target environment."; exit 1
          fi

      # Only a reviewed default branch may reach a real environment. This is a
      # second line of defence behind branch protection, not a replacement.
      - name: Refuse an unreviewed ref
        run: |
          set -euo pipefail
          case "${{ github.ref }}" in
            refs/heads/main|refs/heads/v*) echo "Ref accepted: ${{ github.ref }}" ;;
            *) echo "Database deployment is only permitted from a protected branch."; exit 1 ;;
          esac

  deploy:
    name: ${{ inputs.dry_run && 'Dry run' || 'Apply' }} on ${{ inputs.environment }}
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The GitHub environment supplies the credentials and, for production, the
    # required reviewers. Nothing here is stored in the workflow file.
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      - name: Link the project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"

      # Always compare before changing anything, and always print the plan.
      - name: Compare local and remote migration ledgers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase migration list --linked

      - name: Dry run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --dry-run

      # A backup is taken immediately before any schema change. A deployment
      # without a verified restore point is not a deployment, it is a gamble.
      #
      # Exactly one of two things must hold, and there is no third:
      #
      #   A. PRE_MIGRATION_BACKUP_REF names a verified restore point, or
      #   B. the owner has recorded a migration-specific exception, pinned to
      #      that migration's content hash.
      #
      # B exists because Warsha cannot currently satisfy A: gap G22 in
      # docs/operations/backup-runbook.md records that the Supabase plan is
      # unconfirmed and no restore has ever been performed. The honest response
      # to that is a narrow, recorded, per-migration decision — not a fabricated
      # backup reference, and not a reusable skip switch.
      - name: Confirm a restore point exists
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          BACKUP_REF="${{ vars.PRE_MIGRATION_BACKUP_REF }}"
          EXCEPTION="${{ inputs.backup_exception }}"

          if [ -n "$BACKUP_REF" ] && [ -n "$EXCEPTION" ]; then
            echo "Both a restore point and a backup exception were supplied."
            echo "Pick one: a verified backup does not need an exception."
            exit 1
          fi

          if [ -n "$BACKUP_REF" ]; then
            echo "Restore point recorded: $BACKUP_REF"
            exit 0
          fi

          if [ -z "$EXCEPTION" ]; then
            echo "PRE_MIGRATION_BACKUP_REF is not set for this environment, and no"
            echo "migration-specific backup exception was named."
            echo ""
            echo "Either confirm a pre-migration backup in the Supabase dashboard and"
            echo "record it in docs/operations/backup-runbook.md, or have the owner add"
            echo "an entry to docs/operations/migration-backup-exceptions.json and pass"
            echo "that migration's filename as backup_exception."
            exit 1
          fi

          node scripts/verify-backup-exception.mjs "$EXCEPTION" "${{ inputs.environment }}"

      - name: Apply
        if: ${{ !inputs.dry_run }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked

      # "The migration applied without error" is not success. The structural
      # guarantees the specifications claim are re-checked against the live
      # database before the deployment is called done.
      - name: Post-migration verification
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          echo "Run public.verify_platform_release() as a staff member holding"
          echo "view_audit_logs and record the result in the deployment log."
          echo "A non-zero failure count blocks sign-off."

      - name: Record the deployment
        if: always()
        run: |
          echo "environment=${{ inputs.environment }}"
          echo "dry_run=${{ inputs.dry_run }}"
          echo "ref=${{ github.sha }}"
          echo "actor=${{ github.actor }}"
